{% extends 'base.html' %}

{% block title %}글쓰기 - 게시판{% endblock %}

{% block content %}
<h1 class="mb-4">{% if post %}글 수정{% else %}글쓰기{% endif %}</h1>

<form method="post">
    {% csrf_token %}
    
    <div class="mb-3">
        <label for="title" class="form-label">제목</label>
        <input type="text" class="form-control" id="title" name="title" 
               value="{{ post.title|default:'' }}" required maxlength="200">
    </div>
    
    <div class="mb-3">
        <label for="content" class="form-label">내용</label>
        <textarea class="form-control" id="content" name="content" 
                  rows="15" required>{{ post.content|default:'' }}</textarea>
    </div>
    
    <div class="d-flex justify-content-between">
        <a href="{% if post %}{% url 'board:detail' post.id %}{% else %}{% url 'board:list' %}{% endif %}" 
           class="btn btn-secondary">취소</a>
        <button type="submit" class="btn btn-primary">
            {% if post %}수정하기{% else %}작성하기{% endif %}
        </button>
    </div>
</form>
{% endblock %}
